name: Build iOS IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # [핵심 해결책] 소스코드 빌드 전에 맥 서버 내부의 CocoaPods 시스템을 강제로 업데이트합니다.
      - name: Install Tools
        run: |
          sudo gem install cocoapods
          pod repo update

      # [Exit Code 65 해결] 누락된 외부 라이브러리 파일들을 서버가 직접 빌드 환경에 맞게 강제 설치하도록 만듭니다.
      - name: Setup CocoaPods Dependencies
        run: |
          if [ -f "Podfile" ]; then 
            pod install --repo-update
          else
            echo "Warning: Podfile not found. Trying to generate or find project targets."
          fi

      - name: Find and Build Xcode Project
        run: |
          WORKSPACE_FILE=$(find . -name "*.xcworkspace" | head -n 1)
          if [ -z "$WORKSPACE_FILE" ]; then
            WORKSPACE_FILE=$(find . -name "*.xcodeproj" | head -n 1)
            BUILD_CMD="-project $WORKSPACE_FILE"
          else
            BUILD_CMD="-workspace $WORKSPACE_FILE"
          fi
          
          SCHEME_NAME=$(xcodebuild -list -json | json_pp | grep -m 1 '"schemes"' -A 1 | tail -n 1 | tr -d '" ,')
          echo "Selected Scheme: $SCHEME_NAME"
          
          # 서명 관련 검사 및 경고를 전부 무시하고 무조건 통과시키는 명령어 세트입니다.
          xcodebuild $BUILD_CMD -scheme "$SCHEME_NAME" -configuration Release -sdk iphoneos \
            ALLOW_PROVISIONING_PROFILE_REQUIRED=NO \
            ALLOW_PROVISIONING_DEVICE_REGISTRATION_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=YES \
            clean archive -archivePath build/VoidLink.xcarchive

      - name: Extract App and Packaging
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/VoidLink.xcarchive/Products/Applications -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found in archive."
            exit 1
          fi
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r VoidLink_unsigned.ipa Payload

      - name: Upload Finished IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-Unsigned-IPA
          path: build/VoidLink_unsigned.ipa





